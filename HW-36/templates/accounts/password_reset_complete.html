{% extends 'base.html' %}

{% block title %}პაროლი წარმატებით შეიცვალა - Electro Store{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="card border-0 shadow-sm rounded-3 text-center">
            <div class="card-body p-4 p-md-5">
                <div class="rounded-circle bg-success text-white d-inline-flex align-items-center justify-content-center fs-2 mb-3" style="width: 70px; height: 70px;">
                    <i class="fas fa-check-double"></i>
                </div>
                <h4 class="font-weight-bold text-dark mb-3">პაროლი წარმატებით შეიცვალა!</h4>
                <p class="text-muted leading-relaxed mb-4">
                    თქვენი პაროლი წარმატებით განახლდა. ახლა შეგიძლიათ შეხვიდეთ სისტემაში ახალი პაროლით.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary rounded-pill px-4">
                    <i class="fas fa-sign-in-alt me-1"></i> შესვლა
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
